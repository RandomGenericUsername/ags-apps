name: bar

# Per-app CI for the bar (REQ-001): the bar's pure-module tests run here.
#
# `ags-test` needs only Node + the pure modules, so it runs on a stock
# `ubuntu-latest` runner. The bar's typecheck is a LOCAL gate
# (`make bar-typecheck`): it needs `ags` on PATH plus the Astal/GIR libraries
# and generates ~49 MB of machine-specific .d.ts, so it cannot run on a stock
# runner. See AGENTS.md §4 — CI intentionally runs only stock-runner jobs.
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch
# are still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ags-test:
    name: ags-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the bar pure-module unit tests
        run: make ags-test

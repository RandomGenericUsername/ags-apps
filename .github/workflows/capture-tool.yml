name: capture-tool

# Per-app CI for capture-tool (REQ-003): the app's pure-module tests and the
# Python backend's pytest suites run here.
#
# Both remaining jobs are stock-runner gates: `capture-tool-tests` needs only
# Node + tsc, and `capture-tool-backend-tests` needs Python 3 + uv because the
# backend script (`capture-tool/bin/capture-tool`) is stdlib-only and its suites
# import it by absolute path, so it needs nothing from AGS. The typecheck
# (`make capture-tool-typecheck`) is a LOCAL gate: it needs `ags` on PATH plus
# the Astal/GIR libraries and generates ~49 MB of machine-specific .d.ts, so it
# cannot run on a stock runner. See AGENTS.md §4.
#
# There is no drift job: capture-tool consumes no contract topic, so it carries
# no `event-contract-drift.mjs` (see the capture-tool section of the Makefile).
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch are
# still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  capture-tool-tests:
    name: capture-tool-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the capture-tool pure-module unit tests + acceptance
        run: make capture-tool-tests

  capture-tool-backend-tests:
    name: capture-tool-backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Run the capture-tool Python backend pytest suites
        run: make capture-tool-backend-tests

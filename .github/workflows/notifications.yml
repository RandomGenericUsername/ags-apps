name: notifications

# Per-app CI for notifications (REQ-002): the app's tests + drift + architecture
# gate run here.
#
# `notifications-tests`, `notifications-drift-test` and
# `speedtest-no-new-architecture` need only Node + the shared platform client +
# the canonical `contracts` checkout (and python3-stdlib for the last), so they
# run on a stock `ubuntu-latest` runner. The typecheck
# (`make notifications-typecheck`) is a LOCAL gate: it needs `ags` on PATH plus
# the Astal/GIR libraries and generates machine-specific .d.ts, so it cannot run
# on a stock runner. See AGENTS.md §4.
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch are
# still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  notifications-tests:
    name: notifications-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the notifications pure-module unit tests
        run: make notifications-tests

  notifications-drift-test:
    name: notifications-drift-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out the canonical event contract
        uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/contracts
          ref: v0.3.0
          path: contracts
      - name: Assert the canonical contract is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/contracts/event-contract.json" ]; then
            echo "FAIL: no canonical contract at $GITHUB_WORKSPACE/contracts/event-contract.json -- the contracts checkout did not happen" >&2
            exit 1
          fi
      - name: Run the drift gate
        run: CONTRACTS_ROOT="$GITHUB_WORKSPACE/contracts" make notifications-drift-test

  speedtest-no-new-architecture:
    name: speedtest-no-new-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the re-homed architecture gate
        run: make speedtest-no-new-architecture

name: hypr-pano

# Per-app CI for hypr-pano (REQ-004): the app's typecheck + drift gate.
#
# Split by runner capability, mirroring bar.yml: `hypr-pano-drift-test` needs
# only Node + the shared platform client + the canonical `contracts` checkout,
# so it runs on a stock `ubuntu-latest` runner; `hypr-pano-typecheck` needs
# `ags` on PATH plus the Astal/GIR libraries and generates ~49 MB of
# machine-specific .d.ts, so it runs on a `[self-hosted, linux]` runner that
# HAS the desktop stack.
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch are
# still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hypr-pano-drift-test:
    name: hypr-pano-drift-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out the canonical event contract
        uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/contracts
          path: contracts
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
      - name: Assert the canonical contract is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/contracts/event-contract.json" ]; then
            echo "FAIL: no canonical contract at $GITHUB_WORKSPACE/contracts/event-contract.json -- the contracts checkout did not happen (is CONTRACTS_READ_TOKEN set with read access to the private contracts repo?)" >&2
            exit 1
          fi
      - name: Run the drift gate
        run: CONTRACTS_ROOT="$GITHUB_WORKSPACE/contracts" make hypr-pano-drift-test

  hypr-pano-typecheck:
    name: hypr-pano-typecheck
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck the hypr-pano tree
        run: make hypr-pano-typecheck

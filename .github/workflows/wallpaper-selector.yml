name: wallpaper-selector

# Per-app CI for wallpaper-selector (REQ-005): the app's tests + drift gate run
# here.
#
# `wallpaper-selector-tests` and `wallpaper-selector-drift-test` need only Node +
# the shared platform client + the canonical `contracts` checkout, so they run
# on a stock `ubuntu-latest` runner. The typecheck
# (`make wallpaper-selector-typecheck`) is a LOCAL gate: it needs `ags` on PATH
# plus the Astal/GIR libraries and generates machine-specific .d.ts, so it
# cannot run on a stock runner. See AGENTS.md §4.
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch are
# still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wallpaper-selector-tests:
    name: wallpaper-selector-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the wallpaper-selector pure-model unit tests
        run: make wallpaper-selector-tests

  wallpaper-selector-drift-test:
    name: wallpaper-selector-drift-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out the canonical event contract
        uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/contracts
          path: contracts
      - name: Assert the canonical contract is present
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/contracts/event-contract.json" ]; then
            echo "FAIL: no canonical contract at $GITHUB_WORKSPACE/contracts/event-contract.json -- the contracts checkout did not happen" >&2
            exit 1
          fi
      - name: Run the drift gate
        run: CONTRACTS_ROOT="$GITHUB_WORKSPACE/contracts" make wallpaper-selector-drift-test

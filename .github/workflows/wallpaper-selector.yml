name: wallpaper-selector

# Per-app CI for wallpaper-selector (REQ-005): the app's typecheck + tests +
# drift gate.
#
# Split by runner capability, mirroring bar.yml / hypr-pano.yml /
# notifications.yml / capture-tool.yml: `wallpaper-selector-tests` and
# `wallpaper-selector-drift-test` need only Node + the shared platform client +
# the canonical `contracts` checkout, so they run on a stock `ubuntu-latest`
# runner; `wallpaper-selector-typecheck` needs `ags` on PATH plus the Astal/GIR
# libraries and generates ~49 MB of machine-specific .d.ts, so it runs on a
# `[self-hosted, linux]` runner that HAS the desktop stack.
#
# TRIGGER. This repository's default branch is `main`; PRs from any branch are
# still checked via `pull_request` (unfiltered).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wallpaper-selector-tests:
    name: wallpaper-selector-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the wallpaper-selector pure-model unit tests
        run: make wallpaper-selector-tests

  wallpaper-selector-drift-test:
    name: wallpaper-selector-drift-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out the canonical event contract
        uses: actions/checkout@v4
        with:
          repository: RandomGenericUsername/contracts
          path: contracts
      - name: Run the drift gate
        run: CONTRACTS_ROOT="$GITHUB_WORKSPACE/contracts" make wallpaper-selector-drift-test

  wallpaper-selector-typecheck:
    name: wallpaper-selector-typecheck
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck the wallpaper-selector tree
        run: make wallpaper-selector-typecheck
